; Indorep QRIS Mini Display — firmware for ESP32-4827S043 (4.3" 480x272 ILI6485)
;
; Hardware truth: 4.3inch_ESP32-4827S043/ (vendor folder in this repo)
;   MCU   ESP32-S3-WROOM-1-N16R8 (16MB flash, 8MB PSRAM)
;   Panel 480x272 ILI6485 over 16-bit parallel RGB (ESP32-S3 LCD_CAM)
;   Touch GT911 on its own I2C bus (SDA 19, SCL 20, RST 38)
;   BL    plain GPIO2
;
; Platform: pioarduino fork, which ships Arduino core 3.x / ESP-IDF 5.x. The
; stock platformio espressif32 platform is stuck on Arduino core 2.x (IDF 4.4),
; whose esp_lcd RGB-panel API predates the pin/timing fields used here.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory / flash ---------------------------------------------------------
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Do NOT enable USB-CDC: GPIO19/20 are the GT911 I2C bus on this module.
    ; Console goes over the on-board USB-UART bridge (UART0, GPIO43/44).
    ; (ARDUINO_USB_MODE is already set by the board variant; do not redefine it.)
    ; lv_conf.h lives in the project root; add it to the include path so the
    ; LVGL library, which is built as a separate lib, can find it.
    -I.
    ; src/qr_render.cpp includes LVGL's vendored qrcodegen.h directly (to size
    ; the QR before creating the widget). LVGL builds that header from its own
    ; src/extra/libs/qrcode directory, which is not on our include path.
    -I.pio/libdeps/esp32-s3-devkitc-1/lvgl/src/extra/libs/qrcode
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_TICK_CUSTOM=1
    -DLV_TICK_CUSTOM_INCLUDE=\"Arduino.h\"
    -DLV_TICK_CUSTOM_SYS_TIME_EXPR=(millis())

    ; --- HTTP request timeouts ------------------------------------------------
    ; WebServer::handleClient() is pumped from the same loop that drives LVGL, so
    ; a client that trickles a request can hold the loop open and starve input.
    ; The library's guarded limits default to 5 s (one protocol line) and 10 s
    ; (all headers); the Go backend sends a small JSON body from a device on the
    ; same LAN, so these are cut hard. A slow or hostile peer now costs at most
    ; ~2 s of input latency instead of 10.
    ;
    ; Only the #ifndef-guarded macros can be overridden this way. The library's
    ; HTTP_MAX_DATA_WAIT / HTTP_MAX_POST_WAIT are plain #define in the header and
    ; are used directly in the .cpp, so they canNOT be set from here without
    ; producing a redefinition warning — leave them alone.
    -DWEBSERVER_MAX_LINE_WAIT=1000
    -DWEBSERVER_MAX_HEADER_WAIT=2000

build_unflags =
    -std=gnu++11

build_src_flags =
    -std=gnu++17

lib_deps =
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^7.0.4
    ; NOTE: the vendor TAMC_GT911 library (Gt911-arduino-main) is deliberately
    ; NOT used. It has four defects that make it unusable here:
    ;   1. its read() clears the data-ready flag unconditionally, even when the
    ;      controller had no new sample, so it races the panel's own frame rate;
    ;   2. it ignores every I2C return code, so a NAK is indistinguishable from
    ;      a genuine zero;
    ;   3. reset() calls setResolution() unconditionally, and its readPoint()
    ;      applies its own axis inversion on top of the vendor demo's, producing
    ;      a doubly-mirrored result;
    ;   4. it latches its I2C address from the INT pin, which is not wired on
    ;      this module.
    ; src/gt911.cpp is a self-contained register-level replacement. The vendor
    ; folder remains in-tree as read-only hardware reference.
